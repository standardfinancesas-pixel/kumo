<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!--
    Ícono de la pestaña. Es el logo de la web —cuadrado violeta con la gota
    lima—, dibujado como un cuadrado con tres esquinas al 50% y una en punta,
    girado 45°, igual que el div con border-radius del header.

    La gota va más grande que en el header a propósito: respetando la proporción
    original quedaba en el 10% del área y a 16px, que es como se ve una pestaña,
    era un punto ilegible.

    Next lo toma como favicon por estar en app/; no hace falta declarar <link>.
  -->
  <rect width="100" height="100" rx="26" fill="#5D5491"/>
  <path
    d="M50 26 A24 24 0 0 1 74 50 A24 24 0 0 1 50 74 L31 74 A5 5 0 0 1 26 69 L26 50 A24 24 0 0 1 50 26 Z"
    fill="#E1FB62"
    transform="rotate(45 50 50)"
  />
</svg>
